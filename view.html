<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Othe.app - Image Generation Live Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-hover: #1f2937;
            --surface-border: #1f293d;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-green: #10b981;
            --accent-green-bg: rgba(16, 185, 129, 0.12);
            --accent-amber: #f59e0b;
            --accent-amber-bg: rgba(245, 158, 11, 0.12);
            --accent-blue: #3b82f6;
            --accent-blue-gradient: linear-gradient(135deg, #2563eb, #1d4ed8);
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 28px;
            line-height: 1.5;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 24px;
        }

        .header-title h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .status-sync {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--surface);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--surface-border);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .btn-refresh {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background: var(--surface-hover);
            border-color: #374151;
        }

        .toggle-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            user-select: none;
        }

        .toggle-label input {
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        /* Metric Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .metric-value.completed {
            color: var(--accent-green);
        }

        .metric-value.pending {
            color: var(--accent-amber);
        }

        .metric-value.percent {
            color: var(--accent-blue);
        }

        /* Progress Bar */
        .progress-bar-container {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            height: 10px;
            background: #1f293d;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 999px;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Toolbar / Filter */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
        }

        .filter-buttons {
            display: flex;
            background: var(--surface);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--surface-border);
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--accent-blue-gradient);
            color: #fff;
        }

        .search-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex-grow: 1;
            justify-content: flex-end;
        }

        .search-input {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 9px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            min-width: 240px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .industry-select {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 9px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            max-width: 280px;
        }

        .industry-select:focus {
            border-color: var(--accent-blue);
        }

        /* Results Counter */
        .results-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        /* Grid Layout */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .item-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .item-card:hover {
            transform: translateY(-2px);
            border-color: #374151;
        }

        .card-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumb-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
        }

        .placeholder-icon {
            font-size: 20px;
        }

        .thumb-fallback {
            color: #ef4444;
            font-size: 12px;
            font-weight: 500;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.85);
            color: #ffffff;
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.85);
            color: #ffffff;
        }

        .card-body {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 6px;
        }

        .card-industry {
            font-size: 11px;
            font-weight: 600;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: auto;
            padding-top: 8px;
        }

        .pending-note {
            color: var(--accent-amber);
            font-size: 11px;
        }

        .card-actions {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-view {
            font-size: 12px;
            font-weight: 600;
            color: #93c5fd;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-view:hover {
            color: #bfdbfe;
            text-decoration: underline;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-view, .btn-copy, .btn-delete {
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn-view {
            color: #93c5fd;
        }
        .btn-view:hover {
            color: #bfdbfe;
            background: rgba(147, 197, 253, 0.1);
        }

        .btn-copy {
            color: #a7f3d0;
        }
        .btn-copy:hover {
            color: #d1fae5;
            background: rgba(167, 243, 208, 0.1);
        }

        .btn-delete {
            color: #f87171;
        }
        .btn-delete:hover {
            color: #fca5a5;
            background: rgba(248, 113, 113, 0.1);
        }

        /* Modal styling */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.2s ease;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #modal-img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal-prev, .modal-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-prev:hover, .modal-next:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .modal-prev { left: -60px; }
        .modal-next { right: -60px; }

        .empty-state {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            background: var(--surface);
            border: 1px dashed var(--surface-border);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <h1>
                    <span>🎨</span> Othe.app Image Generation Tracker
                </h1>
                <p>Live visualization of batch progress, generated files, and queue status across all 414 professions.</p>
            </div>
            <div class="header-controls">
                <div class="status-sync">
                    <span class="pulse-dot"></span>
                    <span id="last-updated">Connecting...</span>
                </div>
                <label class="toggle-label">
                    <input type="checkbox" id="auto-refresh-toggle" checked>
                    Auto-refresh (5s)
                </label>
                <button class="btn-refresh" id="btn-refresh">
                    <span>↻</span> Refresh
                </button>
            </div>
        </header>

        <!-- Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Total Professions</span>
                <span class="metric-value" id="stat-total">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Completed & Saved</span>
                <span class="metric-value completed" id="stat-completed">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Pending Generation</span>
                <span class="metric-value pending" id="stat-pending">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Completion Progress</span>
                <span class="metric-value percent" id="stat-pct">0%</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-header">
                <span>Overall Batch Progress</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Toolbar / Filters -->
        <div class="toolbar">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All (414)</button>
                <button class="filter-btn" data-filter="completed">Generated</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
            </div>

            <div class="search-controls">
                <select class="industry-select" id="industry-filter">
                    <option value="all">All Industries (97)</option>
                </select>
                <input type="text" class="search-input" id="search-input" placeholder="Search profession or industry...">
            </div>
        </div>

        <div class="results-info" id="filtered-count">
            Loading professions...
        </div>

        <!-- Grid of Images -->
        <div class="items-grid" id="items-grid"></div>
        <!-- Image Modal -->
        <div id="image-modal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" onclick="closeImageModal()">✕</button>
                <img id="modal-img" src="" alt="Full Image" />
                <button class="modal-prev" onclick="navigateModal(-1)">←</button>
                <button class="modal-next" onclick="navigateModal(1)">→</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
